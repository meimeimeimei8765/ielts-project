<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTSpeak - Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>IELTSpeak</h1>
        </header>
        <main class="chat-interface" id="chat-interface">
            <div class="message bot">
                <img src="bot-icon.png" alt="Bot Icon" class="icon">
                <div class="bubble">Hello there! Let's dive right into your IELTS speaking practice. Today, we'll be focusing on Part 2 of the speaking test. Are you ready to describe a memorable event or person?</div>
            </div>
        </main>
        <footer>
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button id="send-button"><img src="send-icon.png" alt="Send Icon"></button>
            <button id="voice-button"><img src="microphone-icon.png" alt="Microphone Icon"></button>
        </footer>
    </div>
    <script src="chat.js"></script>
</body>
</html>
