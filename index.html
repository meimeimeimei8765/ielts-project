<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Speaking Q&A</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>雅思口语问答</h1>
        <div class="input-group">
            <label for="question">输入你的问题:</label>
            <input type="text" id="question" placeholder="请输入你的问题...">
            <label for="user-answer">你的回答:</label>
            <input type="text" id="user-answer" placeholder="请输入你的回答...">
            <button id="submit">提交</button>
        </div>
        <div class="output-group">
            <h2>参考答案:</h2>
            <p id="reference-answer"></p>
        </div>
        <div class="user-answer-group">
            <h2>你的回答:</h2>
            <p id="user-answer-display"></p>
        </div>
        <div class="score-group">
            <h2>评分:</h2>
            <p id="score"></p>
        </div>
        <div class="related-question-group">
            <h2>串题:</h2>
            <p id="related-question"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
